[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enge-spx"
dynamic = ["version", "dependencies"]
description = "Windows AI 编程隔离工作台：容器工作区、固定代理双跳与出口核验"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "licenses/*.md"]
authors = [{ name = "engeeeee" }]

[project.urls]
Homepage = "https://github.com/engeeeee/ENGE-SPX"
Issues = "https://github.com/engeeeee/ENGE-SPX/issues"
Releases = "https://github.com/engeeeee/ENGE-SPX/releases"

[project.scripts]
spx = "enge_spx.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "enge_spx.__version__" }
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enge_spx = ["resources/containers/*", "resources/containers/.dockerignore", "resources/checks/*", "resources/icons/*"]

