name: ENGE SPX Field Recording
on:
  workflow_dispatch:
  push:
    branches: [feature/field-resource-recording]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/field-recording.yml']
permissions:
  contents: read
concurrency:
  group: spx-field-recording-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: src
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_gui.py
      - name: Native OS recording without Docker startup
        run: python tests/integration_recording.py --output native-recording.json
      - name: Three 0.11.0 and candidate host pairs
        shell: python
        run: |
          import subprocess, sys
          for index in range(3):
              command = [sys.executable, 'tools/benchmark_p0.py', '--kind', 'host', '--baseline', 'fdd319a4cf7947c9d8952ac752c12c721fb2d226', '--output', f'host-field-{index}.json']
              if index % 2:
                  command.append('--candidate-first')
              subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Field-native-${{ runner.os }}
          path: |
            native-recording.json
            host-field-*.json
          if-no-files-found: warn
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u tests/integration_recording.py --context default --output docker-recording.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Field-real-Docker
          path: docker-recording.json
          if-no-files-found: warn
