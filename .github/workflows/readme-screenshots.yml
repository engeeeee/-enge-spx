name: README Windows screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/screenshots/capture.py', '.github/workflows/readme-screenshots.yml']

permissions:
  contents: read

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      QT_SCALE_FACTOR: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Capture unconfigured native Windows UI
        shell: pwsh
        run: python docs/screenshots/capture.py --output "$env:RUNNER_TEMP/spx-readme"
      - uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-README-${{ github.run_id }}
          path: ${{ runner.temp }}/spx-readme/*
          if-no-files-found: error
          retention-days: 7
