name: Windows cold-start regression probe
on:
  push:
    branches: [fix/windows-cold-start-probe]
permissions:
  contents: read
concurrency:
  group: spx-cold-start-probe
  cancel-in-progress: true
jobs:
  original-python315:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_gui_startup.py -v
