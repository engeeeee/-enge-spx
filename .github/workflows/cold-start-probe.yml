name: Windows cold-start regression probe
on:
  push:
    branches: [fix/windows-cold-start-probe]
permissions:
  contents: read
concurrency:
  group: spx-cold-start-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_gui.py
        env:
          SPX_UI_REPORT_DIR: ${{ runner.temp }}/spx-ui-checks
      - run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/windows/SPX.spec
      - run: python tests/test_gui_startup.py --packaged dist/ENGE-SPX/ENGE-SPX.exe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cold-start-window-checks
          path: ${{ runner.temp }}/spx-ui-checks
          if-no-files-found: ignore
