name: Windows cold-start regression probe
on:
  push:
    branches: [fix/windows-cold-start-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_window_frame.py -v
      - run: python -m unittest discover -s tests -p test_gui_startup.py -v
      - run: python tools/smoke_gui.py
