name: Windows terminal transport probe
on:
  push:
    branches: [fix/windows-mouse-ime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe Docker-style ConPTY input
        env:
          SPX_TERMINAL_PROBE_REPORT: ${{ runner.temp }}/windows-terminal-probe.json
        run: python tools/probe_windows_terminal.py
      - name: Verify actual Windows pipe transport and native Qt IME
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_terminal_relay.py -v
          python -m unittest discover -s tests -p test_terminal_usability.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-terminal-probe
          path: ${{ runner.temp }}/windows-terminal-probe.json
