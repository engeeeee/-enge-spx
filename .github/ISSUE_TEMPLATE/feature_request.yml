name: 功能建议
description: 说明使用场景与希望改善的行为
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 描述具体场景和目前受阻的步骤。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 如涉及代理、隔离或账号，请说明信任边界与兼容要求，不要提供真实凭据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
